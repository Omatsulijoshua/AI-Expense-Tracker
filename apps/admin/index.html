<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Expense Tracker — Admin Console</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-warn: #f59e0b;
      --accent-red: #ef4444;
      --border-color: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
    }

    /* Sidebar Layout */
    .sidebar {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      z-index: 90;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
    }
    .nav-item:hover, .nav-item.active {
      background-color: var(--bg-card);
      color: var(--text-main);
    }
    .nav-item.active {
      border-left: 4px solid var(--accent-blue);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      width: 100%;
    }
    header {
      background-color: var(--bg-secondary);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 64px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .menu-btn {
      display: none;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1.2rem;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
    }
    .header-title { font-size: 1.15rem; font-weight: 600; }
    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .status-badge.operational {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }
    .main-body { padding: 24px; flex: 1; }

    /* Responsive Grid & Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
    }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--text-main); }
    .stat-subtitle { font-size: 0.75rem; color: var(--accent-blue); margin-top: 4px; }
    .card-panel {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }

    /* Responsive Scrollable Table */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 8px;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
    th { padding: 12px 14px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(71, 85, 105, 0.5); font-size: 0.85rem; }

    /* Touch-Friendly Action Buttons */
    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-action { background-color: var(--bg-card); color: var(--text-main); }
    .btn-action:hover { background-color: var(--border-color); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .btn-success { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .search-bar {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-main);
      width: 260px;
      font-size: 0.9rem;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .json-viewer {
      font-family: monospace;
      font-size: 0.75rem;
      background: var(--bg-primary);
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--accent-blue);
      max-width: 250px;
      overflow-x: auto;
    }

    /* Mobile Breakpoint (<768px) */
    @media (max-width: 768px) {
      body { flex-direction: column; height: auto; }
      .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 280px;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main-body { padding: 16px; }
      .search-bar { width: 100%; }
      .stats-grid { grid-template-columns: 1fr; }
      .card-title { flex-direction: column; align-items: flex-start; }
      header { padding: 12px 16px; }
      .header-title { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileSidebar(false)"></div>

  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span>⚡</span> AI Expense Admin
      </div>
    </div>
    <div class="nav-item active" onclick="switchTab('overview')">
      <span>📊</span> System Overview
    </div>
    <div class="nav-item" onclick="switchTab('users')">
      <span>👥</span> User Management
    </div>
    <div class="nav-item" onclick="switchTab('providers')">
      <span>🔌</span> Provider Health
    </div>
    <div class="nav-item" onclick="switchTab('ai-metrics')">
      <span>🤖</span> AI Cost & Tokens
    </div>
    <div class="nav-item" onclick="switchTab('audit-logs')">
      <span>📜</span> System Audit Logs
    </div>
  </div>

  <div class="content-area">
    <header>
      <div class="header-left">
        <button class="menu-btn" onclick="toggleMobileSidebar(true)">☰</button>
        <div class="header-title" id="page-title">System Overview</div>
      </div>
      <div class="status-badge operational">
        <span>●</span> Operational System
      </div>
    </header>

    <div class="main-body" id="app">
      <!-- Rendered dynamically by main.ts -->
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
