<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Expense Tracker — Admin Console</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-warn: #f59e0b;
      --accent-red: #ef4444;
      --border-color: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-item:hover, .nav-item.active {
      background-color: var(--bg-card);
      color: var(--text-main);
    }
    .nav-item.active {
      border-left: 4px solid var(--accent-blue);
    }
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    header {
      background-color: var(--bg-secondary);
      padding: 16px 32px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title { font-size: 1.2rem; font-weight: 600; }
    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge.operational {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }
    .main-body { padding: 32px; flex: 1; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
    .stat-subtitle { font-size: 0.75rem; color: var(--accent-blue); margin-top: 4px; }
    .card-panel {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 12px 16px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; font-size: 0.85rem; }
    td { padding: 14px 16px; border-bottom: 1px solid rgba(71, 85, 105, 0.5); font-size: 0.9rem; }
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-action { background-color: var(--bg-card); color: var(--text-main); }
    .btn-action:hover { background-color: var(--border-color); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .btn-success { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .search-bar {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-main);
      width: 260px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .json-viewer {
      font-family: monospace;
      font-size: 0.8rem;
      background: var(--bg-primary);
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">
      <span>⚡</span> AI Expense Admin
    </div>
    <div class="nav-item active" onclick="switchTab('overview')">
      <span>📊</span> System Overview
    </div>
    <div class="nav-item" onclick="switchTab('users')">
      <span>👥</span> User Management
    </div>
    <div class="nav-item" onclick="switchTab('providers')">
      <span>🔌</span> Provider Health
    </div>
    <div class="nav-item" onclick="switchTab('ai-metrics')">
      <span>🤖</span> AI Cost & Tokens
    </div>
    <div class="nav-item" onclick="switchTab('audit-logs')">
      <span>📜</span> System Audit Logs
    </div>
  </div>

  <div class="content-area">
    <header>
      <div class="header-title" id="page-title">System Overview</div>
      <div class="status-badge operational">
        <span>●</span> Operational System
      </div>
    </header>

    <div class="main-body" id="app">
      <!-- Rendered dynamically by main.ts -->
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
